{% extends "base.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<section class="card estreito">
  <h1>Entrar</h1>
  <form method="post">
    <label>Login
      <input name="login" autocomplete="username">
    </label>
    <label>Senha
      <input name="senha" type="password" autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
