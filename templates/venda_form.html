{% extends "base.html" %}
{% block titulo %}Nova venda{% endblock %}
{% block conteudo %}
<section class="card estreito">
  <h1>Registrar venda</h1>
  <form method="post">
    <label>Produto
      <select name="produto_id">
        <option value="">Selecione</option>
        {% for p in produtos %}
        <option value="{{ p.id }}" {% if request.form.get('produto_id') == p.id|string %}selected{% endif %}>
          {{ p.nome }} {{ p.volume_ml }} ml ({{ p.preco | brl }}, estoque {{ p.estoque }})
        </option>
        {% endfor %}
      </select>
    </label>
    <label>Quantidade
      <input name="quantidade" value="{{ request.form.get('quantidade', '1') }}" inputmode="numeric">
    </label>
    <button type="submit">Confirmar venda</button>
  </form>
</section>
{% endblock %}
